name: Build

# A debug APK on every push and pull request, kept as an artifact so a build can
# be installed without a local toolchain.
#
# Nothing here overrides the project's Gradle settings. That is deliberate:
# gradle.properties holds only portable configuration, and anything specific to a
# machine (JDK location, an aapt2 override for a non-x86_64 host, heap caps) lives
# in that machine's GRADLE_USER_HOME. A workflow that had to patch the repository's
# build settings before it could build would be a sign the repository was carrying
# someone's local setup.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A newer push to the same ref makes the in-flight run redundant.
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          # AGP 8.5 targets JDK 17; a newer JDK is not a safe substitute here
          # because the Kotlin 2.0 compiler's bundled tooling cannot parse it.
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        # Runs before the APK so a failing test fails the job on its own evidence
        # rather than being attributed to packaging.
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Upload test report
        # Wanted precisely when the previous step failed, which is why this is
        # not conditional on success.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore
          retention-days: 14

      - name: Assemble debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: processlens-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          # An empty artifact that silently succeeds would be worse than a failure.
          if-no-files-found: error
          retention-days: 14
