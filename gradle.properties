# ---- Memory-conservative config for an on-device aarch64 build host ----
# The Kotlin compiler runs in-process so a second daemon does not compete for RAM.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.caching=false
org.gradle.configureondemand=false

kotlin.compiler.execution.strategy=in-process

# ---- Toolchain pin ----
# This host's default JDK is newer than the Kotlin 2.0.x compiler's bundled
# IntelliJ utilities can parse. AGP 8.5 targets JDK 17 anyway, so pin explicitly.
org.gradle.java.home=/usr/lib/jvm/java-17-openjdk-arm64

# ---- aarch64 build-host fix ----
# AGP downloads an x86_64 aapt2 from Maven, which cannot execute on an ARM device.
# Point it at the native aapt2 that ships with the distro's android-sdk packages.
android.aapt2FromMavenOverride=/usr/bin/aapt2

android.useAndroidX=true
android.nonTransitiveRClass=true
