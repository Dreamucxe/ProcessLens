# Portable project settings only.
#
# Host-specific configuration — the JDK location, an aapt2 override for a build
# host that is not x86_64, heap caps, the daemon and the Kotlin compiler strategy
# — belongs in GRADLE_USER_HOME/gradle.properties (~/.gradle/gradle.properties),
# which Gradle resolves ahead of this file. Keeping it out of the repository is
# what lets one checkout build both on a CI runner and on an on-device ARM host
# without either one having to edit the other's settings. It used to live here,
# and a CI runner reading it would have failed on the first line that named a
# path only the authoring device has.

# AGP needs more than Gradle's default heap to run KSP and Compose in one
# invocation. A memory-constrained host should override this downward in
# GRADLE_USER_HOME, not lower it here for everyone.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8

android.useAndroidX=true
android.nonTransitiveRClass=true
